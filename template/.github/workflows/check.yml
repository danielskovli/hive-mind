name: check

# What must hold in this hive however it got there, with the checks of the core it pins: on every pull
# request, and daily, since main is pushed to after every agent's turn. GitHub tells you when it fails.
# The core's own scenarios run in the core's CI, not here.
on:
  pull_request:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The core this hive pins
        run: |
          set -- $(awk '!/^[[:space:]]*(#|$)/ { print $2, $3; exit }' hive.lock)
          git clone -q "$1" hive-mind && git -C hive-mind checkout -q --detach "$2"
      - run: sh hive-mind/tests/invariants.sh
      - name: Only memory, decisions, the Worklog backup and hive.lock change outside pull requests
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bad=""
          for sha in $(sh hive-mind/tests/unreviewed.sh); do
            prs=$(gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" --jq 'length')
            [ "$prs" != 0 ] || bad="$bad $sha"
          done
          if [ -n "$bad" ]; then
            echo "Commits on main that change more than memory/, decisions/, worklog/ and hive.lock without a pull request:$bad"
            exit 1
          fi
